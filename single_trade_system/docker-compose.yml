version: '3.8'

services:
  single_trade_train:
    build: .
    command: python src/train_single_filter.py
    volumes:
      - ../:/app/data:ro
      - ./output:/app/output

  single_trade_web:
    build: .
    ports:
      - "8005:8005"
    volumes:
      - ../:/app/data:ro
      - ./output:/app/output
    command: python server.py
